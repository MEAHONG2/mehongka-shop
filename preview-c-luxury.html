<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미리보기 C - 레드 럭셔리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: sans-serif; background:#0b0b0b; color:#eee; }
  :root { --red:#c8102e; }

  .top-bar { background:#000; padding:9px 40px; }
  .top-bar nav ul { list-style:none; display:flex; gap:24px; }
  .top-bar a { color:#bbb; text-decoration:none; font-size:13px; font-weight:600; }
  .top-bar a:hover { color:var(--red); }

  header {
    display:flex; justify-content:space-between; align-items:center;
    padding:24px 40px; background:#111; border-bottom:1px solid var(--red);
  }
  header h1 { font-family:'Nanum Myeongjo',serif; font-size:25px; color:var(--red); letter-spacing:1px; }
  header p { font-size:12px; color:#999; margin-top:5px; }
  .hright { display:flex; align-items:center; gap:18px; }
  .search { padding:9px 14px; background:#1a1a1a; border:1px solid #333; border-radius:6px; color:#eee; width:180px; font-size:13px; }
  .cart { font-size:22px; position:relative; cursor:pointer; color:var(--red); }
  .cart .badge { position:absolute; top:-6px; right:-10px; background:var(--red); color:#fff; font-size:10px; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

  .hero { padding:70px 40px; text-align:center; }
  .hero .badge-sale { display:inline-block; border:1px solid var(--red); color:var(--red); padding:6px 18px; border-radius:20px; font-size:12px; font-weight:700; margin-bottom:22px; }
  .hero h2 { font-family:'Nanum Myeongjo',serif; font-size:38px; margin-bottom:14px; }
  .hero p { color:#999; font-size:15px; margin-bottom:28px; }
  .hero button { background:var(--red); color:#fff; border:none; padding:13px 32px; border-radius:6px; font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 6px 20px rgba(200,16,46,.35); }
  .hero button:hover { opacity:.88; }

  .cats { display:flex; gap:20px; padding:10px 40px 60px; justify-content:center; }
  .cat {
    flex:1; max-width:220px; background:#151515; border:1px solid var(--red); border-radius:12px;
    padding:36px 18px; text-align:center; transition:.2s;
  }
  .cat:hover { box-shadow:0 0 22px rgba(200,16,46,.3); transform:translateY(-3px); }
  .cat .ico { font-size:34px; margin-bottom:14px; }
  .cat h3 { font-family:'Nanum Myeongjo',serif; font-size:17px; color:var(--red); margin-bottom:8px; }
  .cat p { font-size:12px; color:#999; }

  footer { text-align:center; padding:26px; color:#777; font-size:12px; border-top:1px solid var(--red); background:#000; }
</style>
</head>
<body>
  <div class="top-bar">
    <nav><ul>
      <li><a href="#">홈</a></li><li><a href="#">RC</a></li><li><a href="#">프라모델</a></li><li><a href="#">피규어</a></li><li><a href="#">로그인</a></li>
    </ul></nav>
  </div>
  <header>
    <div>
      <h1>메홍키덜트샾이지롱</h1>
      <p>어릴 적 그 설렘 그대로, 추억을 다시 만나는 곳</p>
    </div>
    <div class="hright">
      <input class="search" placeholder="상품을 검색해보세요">
      <div class="cart">🛒<span class="badge">3</span></div>
    </div>
  </header>
  <section class="hero">
    <div class="badge-sale">🎉 1주년 기념 20% 할인</div>
    <h2>지금 바로, 나만의 취미를 시작하세요</h2>
    <p>RC부터 프라모델, 피규어까지 — 온 가족이 즐기는 취미템</p>
    <button>이벤트 보기</button>
  </section>
  <div class="cats">
    <div class="cat"><div class="ico">🚗</div><h3>RC</h3><p>고속 RC카, 드론, 보트까지</p></div>
    <div class="cat"><div class="ico">🤖</div><h3>프라모델</h3><p>건담, 전투기, 전함, 로봇</p></div>
    <div class="cat"><div class="ico">🦸</div><h3>피규어</h3><p>히어로, 동물, 우주인 피규어</p></div>
  </div>
  <footer>메홍키덜트샾 | 전화: 010-1234-5678 | 이메일: contact@mehongka.com</footer>
</body>
</html>
