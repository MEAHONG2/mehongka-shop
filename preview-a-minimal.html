<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미리보기 A - 미니멀 다크</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Segoe UI', sans-serif; background:#0a0a0a; color:#eee; }
  :root { --red:#e63946; --dark:#0a0a0a; }

  .top-bar { background:#000; padding:10px 40px; border-bottom:1px solid #1a1a1a; }
  .top-bar nav ul { list-style:none; display:flex; gap:28px; }
  .top-bar a { color:#999; text-decoration:none; font-size:13px; font-weight:600; letter-spacing:.5px; }
  .top-bar a:hover { color:var(--red); }

  header { display:flex; justify-content:space-between; align-items:center; padding:28px 40px; }
  header h1 { font-size:22px; font-weight:800; letter-spacing:1px; }
  header h1 span { color:var(--red); }
  header p { font-size:12px; color:#777; margin-top:4px; }
  .hright { display:flex; align-items:center; gap:20px; }
  .search { padding:9px 14px; background:#141414; border:1px solid #222; border-radius:3px; color:#eee; width:180px; font-size:13px; }
  .cart { font-size:22px; position:relative; cursor:pointer; }
  .cart .badge { position:absolute; top:-6px; right:-10px; background:var(--red); color:#fff; font-size:10px; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

  .hero { padding:90px 40px; text-align:center; border-top:1px solid #151515; border-bottom:1px solid #151515; }
  .hero span.tag { color:var(--red); font-size:12px; letter-spacing:3px; font-weight:700; }
  .hero h2 { font-size:42px; font-weight:800; margin:16px 0; letter-spacing:-1px; }
  .hero p { color:#888; font-size:15px; margin-bottom:30px; }
  .hero button { background:var(--red); color:#fff; border:none; padding:14px 34px; font-weight:700; font-size:14px; letter-spacing:1px; cursor:pointer; }
  .hero button:hover { background:#c1121f; }

  .cats { display:flex; gap:1px; background:#151515; margin-top:1px; }
  .cat { flex:1; background:#0a0a0a; padding:50px 20px; text-align:center; transition:.2s; }
  .cat:hover { background:#120707; }
  .cat .ico { font-size:34px; margin-bottom:14px; }
  .cat h3 { font-size:16px; font-weight:700; margin-bottom:6px; }
  .cat p { font-size:12px; color:#777; }
  .cat .line { width:24px; height:2px; background:var(--red); margin:16px auto 0; }

  footer { text-align:center; padding:30px; color:#555; font-size:12px; border-top:1px solid #151515; margin-top:1px; }
</style>
</head>
<body>
  <div class="top-bar">
    <nav><ul>
      <li><a href="#">홈</a></li><li><a href="#">RC</a></li><li><a href="#">프라모델</a></li><li><a href="#">피규어</a></li><li><a href="#">로그인</a></li>
    </ul></nav>
  </div>
  <header>
    <div>
      <h1>메홍<span>키덜트</span>샾</h1>
      <p>어릴 적 그 설렘 그대로</p>
    </div>
    <div class="hright">
      <input class="search" placeholder="상품 검색">
      <div class="cart">🛒<span class="badge">3</span></div>
    </div>
  </header>
  <section class="hero">
    <span class="tag">ANNIVERSARY SALE</span>
    <h2>나만의 취미를 시작하세요</h2>
    <p>RC · 프라모델 · 피규어, 온 가족이 즐기는 취미템</p>
    <button>둘러보기</button>
  </section>
  <div class="cats">
    <div class="cat"><div class="ico">🚗</div><h3>RC</h3><p>고속 RC카 · 드론 · 보트</p><div class="line"></div></div>
    <div class="cat"><div class="ico">🤖</div><h3>프라모델</h3><p>건담 · 전투기 · 전함</p><div class="line"></div></div>
    <div class="cat"><div class="ico">🦸</div><h3>피규어</h3><p>히어로 · 동물 · 우주인</p><div class="line"></div></div>
  </div>
  <footer>메홍키덜트샾 | 전화: 010-1234-5678</footer>
</body>
</html>
