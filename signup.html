<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메홍키덜트샾 - 회원가입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: sans-serif;
    color: #eee;
    background-color: #0a0a0a;
  }

  :root {
    --gold: #d4af37;
    --dark: #111111;
  }

  .top-bar {
    background-color: #000000;
    padding: 8px 30px;
  }
  nav ul {
    list-style: none;
    display: flex;
    gap: 20px;
  }
  nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
  }
  nav a:hover {
    color: var(--gold);
  }
  nav li {
    position: relative;
  }
  .submenu {
    display: none;
    list-style: none;
    position: absolute;
    top: 100%;
    left: 0;
    background-color: var(--dark);
    border: 1px solid var(--gold);
    padding: 10px;
    border-radius: 8px;
    min-width: 100px;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
  }
  nav li:hover .submenu {
    display: flex;
  }

  header {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 30px;
    background-color: var(--dark);
    border-bottom: 1px solid var(--gold);
  }
  header .logo h1 {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 26px;
    color: var(--gold);
    letter-spacing: 1px;
    text-align: center;
  }
  header .logo p {
    font-size: 13px;
    margin-top: 4px;
    color: #bbb;
    text-align: center;
  }

  .auth-wrap {
    max-width: 420px;
    margin: 50px auto;
    padding: 0 20px 60px;
  }
  .auth-panel {
    background-color: #1a1a1a;
    border: 1px solid var(--gold);
    border-radius: 14px;
    padding: 32px 28px;
  }
  .auth-panel h2 {
    font-family: 'Nanum Myeongjo', serif;
    color: var(--gold);
    margin-bottom: 22px;
    text-align: center;
    font-size: 23px;
  }
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 13px;
    color: #bbb;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background-color: #0f0f0f;
    color: #eee;
    font-size: 14px;
  }
  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--gold);
  }
  .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background-color: #0f0f0f;
    color: #eee;
    font-size: 14px;
    font-family: inherit;
  }
  .auth-btn {
    width: 100%;
    background-color: var(--gold);
    color: #111;
    border: none;
    padding: 12px;
    border-radius: 7px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin-top: 6px;
  }
  .auth-btn:hover {
    opacity: 0.85;
  }
  .auth-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .auth-msg {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 16px;
  }
  .auth-msg.error {
    color: #e23b3b;
  }
  .auth-msg.success {
    color: #4caf50;
  }
  .auth-switch {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    color: #999;
  }
  .auth-switch a {
    color: var(--gold);
    text-decoration: none;
    font-weight: bold;
  }

  footer {
    background-color: #000000;
    color: #ccc;
    text-align: center;
    padding: 25px;
    font-size: 14px;
    border-top: 1px solid var(--gold);
  }
</style>
</head>
<body>

  <!-- 상단 메뉴 바 -->
  <div class="top-bar">
    <nav>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li>
          <a href="#">상품 ▾</a>
          <ul class="submenu">
            <li><a href="rc.html">RC</a></li>
            <li><a href="plamo.html">프라모델</a></li>
            <li><a href="figure.html">피규어</a></li>
          </ul>
        </li>
        <li><a href="login.html">로그인</a></li>
        <li><a href="admin.html">관리자</a></li>
      </ul>
    </nav>
  </div>

  <header>
    <div class="logo">
      <h1>메홍키덜트샾이지롱</h1>
      <p>어릴 적 그 설렘 그대로, 추억을 다시 만나는 곳</p>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-panel">
      <h2>회원가입</h2>
      <form id="signupForm" onsubmit="return handleSignup(event)">
        <div class="field">
          <label for="su_name">이름</label>
          <input type="text" id="su_name" placeholder="홍길동" required autocomplete="name">
        </div>
        <div class="field">
          <label for="su_gender">성별</label>
          <select id="su_gender">
            <option value="">선택 안 함</option>
            <option value="male">남성</option>
            <option value="female">여성</option>
          </select>
        </div>
        <div class="field">
          <label for="su_email">이메일</label>
          <input type="email" id="su_email" placeholder="example@email.com" required autocomplete="email">
        </div>
        <div class="field">
          <label for="su_password">비밀번호</label>
          <input type="password" id="su_password" placeholder="6자 이상" minlength="6" required autocomplete="new-password">
        </div>
        <div class="field">
          <label for="su_password2">비밀번호 확인</label>
          <input type="password" id="su_password2" placeholder="비밀번호를 다시 입력하세요" minlength="6" required autocomplete="new-password">
        </div>
        <button type="submit" class="auth-btn" id="signupBtn">회원가입</button>
      </form>
      <div id="authMsg" class="auth-msg"></div>
      <div class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></div>
    </div>
  </div>

  <footer>
    <p>메홍카덜트샾 | 전화: 010-1234-5678 | 이메일: contact@mehongka.com</p>
    <p>운영시간: 평일 10:00 ~ 19:00</p>
  </footer>

  <script>
    // Supabase가 돌려주는 영어 오류 메시지를 사용자가 이해할 수 있는 한글 안내로 변환
    function translateAuthError(error) {
      const msg = (error && error.message) || '';
      if (/user already registered|already registered/i.test(msg)) {
        return '이미 가입된 이메일입니다. 로그인을 이용해주세요.';
      }
      if (/password should be at least/i.test(msg)) {
        return '비밀번호는 6자 이상이어야 합니다.';
      }
      if (/unable to validate email address|invalid format|invalid email/i.test(msg)) {
        return '이메일 형식이 올바르지 않습니다. 다시 확인해주세요.';
      }
      if (/too many requests|rate limit/i.test(msg)) {
        return '요청이 너무 많습니다. 잠시 후 다시 시도해주세요.';
      }
      if (/network|fetch/i.test(msg)) {
        return '네트워크 연결을 확인한 뒤 다시 시도해주세요.';
      }
      return '회원가입에 실패했습니다. 입력하신 내용을 다시 확인해주세요.';
    }

    async function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('su_name').value.trim();
      const gender = document.getElementById('su_gender').value;
      const email = document.getElementById('su_email').value.trim();
      const password = document.getElementById('su_password').value;
      const password2 = document.getElementById('su_password2').value;
      const msg = document.getElementById('authMsg');
      const btn = document.getElementById('signupBtn');

      msg.textContent = '';
      msg.className = 'auth-msg';

      if (!name) {
        msg.textContent = '이름을 입력해주세요.';
        msg.classList.add('error');
        return false;
      }
      if (password !== password2) {
        msg.textContent = '비밀번호가 일치하지 않습니다.';
        msg.classList.add('error');
        return false;
      }
      if (password.length < 6) {
        msg.textContent = '비밀번호는 6자 이상이어야 합니다.';
        msg.classList.add('error');
        return false;
      }

      btn.disabled = true;
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { name: name, gender: gender || null }
        }
      });
      btn.disabled = false;

      if (error) {
        msg.textContent = translateAuthError(error);
        msg.classList.add('error');
        return false;
      }

      if (data && data.session) {
        // 이메일 확인 절차 없이 바로 로그인된 경우
        msg.textContent = '회원가입이 완료되었습니다! 잠시 후 메인으로 이동합니다.';
        msg.classList.add('success');
        setTimeout(function () { location.href = 'index.html'; }, 1200);
      } else {
        msg.textContent = '회원가입 신청이 완료되었습니다. 이메일로 전송된 확인 링크를 클릭하면 가입이 완료됩니다.';
        msg.classList.add('success');
        document.getElementById('signupForm').reset();
      }
      return false;
    }
  </script>

</body>
</html>
